<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Deckgauge favicon: the brand gauge mark on a teal tile so it stays legible
       at 16px and reads on both light and dark browser tabs. Mirrors DeckgaugeMark. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#115e59" />
      <stop offset="0.55" stop-color="#0f766e" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)" />
  <!-- dial arc -->
  <path d="M15 41 A 17 17 0 0 1 49 41" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" />
  <!-- needle -->
  <line x1="32" y1="41" x2="23" y2="25" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  <!-- signal dot at the needle tip -->
  <circle cx="23" cy="25" r="4.5" fill="#f59e0b" />
  <!-- hub -->
  <circle cx="32" cy="41" r="5.5" fill="#ffffff" />
</svg>
